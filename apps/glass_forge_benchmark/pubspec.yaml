name: glass_forge_benchmark
description: Device benchmark harness for glass_forge — fixed scenes, frame timing capture, regression gates.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

# Dependencies are deliberately minimal.
#
# This app exists to measure raster and build cost. Every native plugin
# registers at startup and every service initialised before runApp lands in the
# frames under test, so the standard Codeable app dependency set (Firebase,
# camera, video, billing, auth providers, network inspectors, device preview)
# is removed here on purpose. Do not add plugins back without a measurement
# reason.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # What we are measuring.
  glass_forge:
    path: ../../packages/glass_forge
  glass_forge_gpu:
    path: ../../packages/glass_forge_gpu
  glass_forge_platform:
    path: ../../packages/glass_forge_platform

  # State + routing for the harness UI itself.
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  go_router: ^17.2.3

  # Run configuration storage.
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Report metadata: which device, which build.
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.0

  intl: any

  # Pure-Dart widget packages, no plugin registration, so no startup cost.
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0

  flutter_phoenix: any
  dio: any
  device_preview: any
  toastification: any
  flutter_native_splash: any
  url_launcher: any
  cached_network_image: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  intl_utils: ^2.8.14
