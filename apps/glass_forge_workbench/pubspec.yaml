name: glass_forge_workbench
description: Visual workbench for glass_forge — test surfaces, tier forcing, material knobs, side-by-side comparison.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # What this workbench exists to exercise.
  glass_forge:
    path: ../../packages/glass_forge

  # State Management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Routing
  go_router: ^17.2.3

  # Localization
  intl: any

  # UI
  flutter_svg: ^2.3.0
  # The velocity-aware spring behind the tab bar's selector. glass_forge
  # already depends on it, so this adds nothing to the build.
  motor: ^1.1.0

  # Launch
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/vectors/icons/
    - assets/images/photos/
    - assets/licenses/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist-mono/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist-mono/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist-mono/GeistMono-SemiBold.ttf
          weight: 600

flutter_native_splash:
  color: "#0D0B2E"
  fullscreen: true
  image: assets/images/splash-with-logo.png
  android_12:
    color: "#0D0B2E"
    image: assets/images/splash-with-logo.png
