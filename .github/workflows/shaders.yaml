name: shaders

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sksl:
    name: shaders compile as SkSL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - run: flutter pub get

      # The example is an app with its own pubspec, so it resolves on its own.
      # Analyzing from the root reaches into example/ as well, and cannot
      # resolve a single import there without this.
      - name: flutter pub get (example)
        run: flutter pub get
        working-directory: example

      # The SkSL gate. A web build compiles every bundled shader through the
      # SkSL target, which is the gate upstream did not have: it shipped
      # shaders that fail SkSL twice, and found out from user bug reports
      # months later.
      #
      # The example is a phone demo with no web/ folder checked in, so
      # `flutter create` makes one. It also writes a template
      # test/widget_test.dart that refers to a `MyApp` this app does not have;
      # that file is deleted straight after, before analyze can trip on it.
      - name: build web (compiles shaders as SkSL)
        run: |
          flutter create --platforms=web .
          flutter build web --release
          rm -f test/widget_test.dart
        working-directory: example

      - name: flutter analyze
        run: flutter analyze

      # This bare invocation reports anything tagged `impeller` as skipped
      # rather than running it (see dart_test.yaml) — see the step below
      # for why, and for where those tests actually run.
      - name: flutter test
        run: flutter test

      # Tests tagged `impeller` (currently glass_composition_test.dart and
      # glass_widgets_test.dart, which construct `ui.ImageFilter.shader`) are
      # skipped by the step above: that API throws `UnsupportedError` unless
      # the engine's Impeller backend is active, and `flutter_tester`'s
      # default software backend — what plain `flutter test` runs on — does
      # not enable it. Run them here instead, explicitly selected and with
      # Impeller turned on. `--run-skipped` is required alongside `--tags`:
      # dart_test.yaml marks the tag `skip`, not `exclude_tags` (exclusions
      # can't be un-excluded from the command line — verified empirically —
      # so `skip` is what leaves them selectable at all).
      #
      # If this step ever turns out not to be viable on headless CI runners
      # (no GPU/Vulkan for Impeller to bind to), move these tests to a
      # device/integration lane rather than deleting them or dropping the
      # flag on the step above.
      #
      # `--enable-flutter-gpu` as well: the accelerated geometry producer is
      # Flutter GPU, and without it the fail-soft test in
      # render_glass_layer_test.dart failed on every run and the two
      # cross-producer parity tests in gpu_geometry_producer_test.dart
      # skipped. With it, the lane is 85 passed, 0 skipped, 0 failed
      # (macOS, Flutter 3.47.2).
      #
      # `-j 1`: one test file at a time. Run in parallel, the Impeller lane
      # intermittently failed a shared `setUpAll(ShaderLibrary.warmUp)` with
      # "manifest could not be decoded: Payload is null or empty". Every
      # test process re-copies the shaders into the `packages/glass_forge/`
      # mirror in test/flutter_test_config.dart, and a process could read a
      # shader while another had it truncated. That copy is now atomic; the
      # lane stays serial anyway, because these tests share one GPU and the
      # failure was only ever seen here.
      - name: flutter test (impeller)
        run: >-
          flutter test --tags impeller --run-skipped --enable-impeller
          --enable-flutter-gpu -j 1
