name: shaders

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sksl:
    name: shaders compile as SkSL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - run: flutter pub get

      # A web build compiles every bundled shader through the SkSL target.
      # This is the gate upstream did not have: it shipped shaders that fail
      # SkSL twice, and found out from user bug reports months later.
      - name: build web (compiles shaders as SkSL)
        run: flutter build web --release -t lib/main_development.dart
        working-directory: apps/glass_forge_workbench

      # Workspace-aware: analyzing from the workspace root covers every
      # package in the pub workspace. Explicit so that stays true on purpose,
      # not because it happens to be the step's default working directory.
      - name: flutter analyze
        run: flutter analyze
        working-directory: .

      # packages/glass_forge is where test/ actually lives — the pub
      # workspace root has none. Without this, `flutter test` fails
      # immediately with `Test directory "test" not found`, before any of
      # the package's tests, including the SDF contract test, ever run.
      - name: flutter test
        run: flutter test
        working-directory: packages/glass_forge
