name: glass_forge_workspace
description: Workspace root for glass_forge — performance-tiered liquid glass for Flutter.
publish_to: none

environment:
  sdk: ^3.13.0

# Dart pub workspaces (native since 3.6) — one shared lockfile, one
# .dart_tool/package_config.json, no cross-package version skew.
#
# glass_forge itself is deliberately ONE package. A consumer runs a single
# `pub add` and gets everything: rendering, tiering, motion, and the native
# accessibility signals. Splitting the native side out would have meant anyone
# who skipped that package silently received a fake Reduce Transparency — the
# exact defect every competing package documents. Not worth the packaging
# tidiness.
workspace:
  - packages/glass_forge
  - packages/glass_forge/example

dev_dependencies:
  very_good_analysis: ^10.3.0
