name: glass_forge
description: Performance-tiered liquid glass rendering for Flutter — real refraction where the GPU allows, graceful degradation everywhere else.
version: 0.1.0
homepage: https://gocodeable.com
repository: https://github.com/Arhamss/glass-forge
issue_tracker: https://github.com/Arhamss/glass-forge/issues

topics:
  - liquid-glass
  - glass
  - shaders
  - ui
  - animation

# Remove when the package is ready to publish.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  hooks: ^2.2.0
  motor: ^1.1.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.codeable.glass_forge
        pluginClass: GlassForgePlugin
      ios:
        pluginClass: GlassForgePlugin
      macos:
        pluginClass: GlassForgePlugin

  shaders:
    - shaders/probe.frag
    - shaders/geometry.frag
    - shaders/final_render.frag
    - shaders/final_render_bilinear_probe.frag
    - shaders/backend_probe.frag

  assets:
    - build/shaderbundles/geometry.shaderbundle
