name: glass_forge_platform
description: Native accessibility and thermal signals for glass_forge — Reduce Transparency, thermal status, low-power mode.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

# Why this is a separate package:
#
# Flutter does not surface Reduce Transparency at all — the iOS accessibility
# bitmask never reads isReduceTransparencyEnabled, and Android has no public
# equivalent. Real parity needs native code, and native code would make
# glass_forge a plugin, forcing pod install and gradle work on consumers who
# only want the pure-Dart path.
#
# So the signals live here. Without this package the core falls back to the
# MediaQuery.highContrast approximation every other Flutter glass package uses,
# and says so in a debug diagnostic rather than pretending it is the real thing.
dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.codeable.glass_forge_platform
        pluginClass: GlassForgePlatformPlugin
      ios:
        pluginClass: GlassForgePlatformPlugin
      macos:
        pluginClass: GlassForgePlatformPlugin
