name: glass_forge
description: Performance-tiered liquid glass rendering for Flutter — real refraction where the GPU allows, graceful degradation everywhere else.
version: 0.1.0
homepage: https://gocodeable.com
# repository and issue_tracker wait for the public repo: pub.dev checks that
# both URLs resolve, and there is no GitHub repository for this package yet.

topics:
  - liquid-glass
  - glass
  - shaders
  - ui
  - animation

# Remove when the package is ready to publish.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Flutter GPU: the optional accelerated geometry producer. `hook/build.dart`
  # compiles the shader bundle these depend on, and it fails soft — see the
  # doc comment there. If the bundle cannot be built, GpuGeometryProducer
  # reports itself unavailable and the package renders through the
  # runtime-effect producer instead. Neither dependency can break a build:
  # flutter_gpu is an SDK package Flutter always resolves, and
  # flutter_gpu_shaders only runs at build time, inside the try/catch above.
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2

  hooks: ^2.0.0

  # Spring physics. Depended on, never vendored — it is stable and maintained.
  # See docs/reference/motor_teardown.md for what it gives us and the six gaps
  # we fill ourselves.
  motor: ^1.1.0

  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  # One package, everything inside.
  #
  # The native side exists because Flutter does not surface Reduce
  # Transparency at all — the iOS accessibility bitmask never reads
  # isReduceTransparencyEnabled, and Android has no public equivalent. Every
  # other Flutter glass package approximates it with MediaQuery.highContrast
  # and ships a documented hole. Splitting this out would mean anyone who did
  # not read the README silently got that same hole, so it lives here.
  plugin:
    platforms:
      android:
        package: com.codeable.glass_forge
        pluginClass: GlassForgePlugin
      ios:
        pluginClass: GlassForgePlugin
      macos:
        pluginClass: GlassForgePlugin

  shaders:
    - shaders/probe.frag
    - shaders/geometry.frag
    - shaders/final_render.frag
    - shaders/final_render_bilinear_probe.frag
    - shaders/backend_probe.frag

  # Generated by hook/build.dart at build time (see ShaderBundleAssetMode
  # docs on buildShaderBundleJson). Not checked into source control; declared
  # here so Flutter bundles it once the hook has produced it. GpuGeometryProducer
  # loads it via ShaderLibrary.fromAsset('packages/glass_forge/build/shaderbundles/geometry.shaderbundle').
  assets:
    - build/shaderbundles/geometry.shaderbundle
