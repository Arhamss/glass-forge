analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # An app, not a library: its widgets are not a public API surface, and
    # doc comments on every private helper would bury the ones that explain
    # the glass. The types a reader is meant to learn from are documented
    # anyway.
    public_member_api_docs: false
