name: glass_forge_example
description: >-
  Five scenes over five photographs, showing what glass_forge renders and
  how it is written.
publish_to: none
version: 1.0.0+1

# Part of the glass_forge workspace: one shared lockfile, and the path
# dependency below resolves to the package in this repository rather than to
# a published version of it.
resolution: workspace

environment:
  sdk: ^3.13.2

# Two dependencies, on purpose. An example that also teaches a router or a
# state-management library is mostly teaching those; Navigator, setState and
# ValueNotifier carry this app on their own.
dependencies:
  flutter:
    sdk: flutter
  glass_forge:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/licenses/

  # Geist and Geist Mono, under the SIL Open Font License 1.1. Bundling a font
  # is a redistribution and the OFL asks for the licence to travel with it, so
  # assets/licenses/ ships too and main() registers it with LicenseRegistry —
  # which is what puts it behind the Licences button in the System scene.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist-mono/GeistMono-Medium.ttf
          weight: 500
