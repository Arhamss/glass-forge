name: glass_forge_gpu
description: Flutter GPU geometry producer for glass_forge — opt-in accelerated matte rendering.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

# Why this is a separate package:
#
# Flutter GPU is a beta SDK dependency and needs a native-assets build hook to
# compile its shader bundle. Shipping it inside glass_forge would compile that
# bundle into every consumer alongside the runtime-effect shaders, and pin them
# to a beta API, for a path many of them will never take.
#
# Add this package to get the accelerated geometry producer. It registers
# itself with the core producer registry at import time. Leave it out and the
# core never knows it existed.
dependencies:
  flutter:
    sdk: flutter
  glass_forge:
    path: ../glass_forge

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0
