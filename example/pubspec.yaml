name: glass_forge_example
description: >-
  A playground for glass_forge: three live scenes and a sheet of knobs for
  every field of the glass material.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Two dependencies, on purpose. An example that also teaches a router or a
# state-management library is mostly teaching those; Navigator, setState and
# ValueNotifier carry this app on their own.
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  glass_forge:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # Pin Swift Package Manager for this project, whatever the machine's
  # global `flutter config` says. Without this the iOS build falls back to
  # CocoaPods on any machine that has opted out globally, which rewrites the
  # two tracked xcconfigs under ios/Flutter/ on every `pub get` and leaves
  # them dirty. Project level beats global: `FlutterFeaturesConfig.isEnabled`
  # resolves `_isEnabledAtProjectLevel(...) ?? _isEnabledByGlobalConfig(...)`.
  config:
    enable-swift-package-manager: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/licenses/

  # Geist and Geist Mono, under the SIL Open Font License 1.1. Bundling a font
  # is a redistribution and the OFL asks for the licence to travel with it, so
  # assets/licenses/ ships too and main() registers it with LicenseRegistry —
  # which is what puts it behind the Licences button in the index's top bar.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist-mono/GeistMono-Medium.ttf
          weight: 500
